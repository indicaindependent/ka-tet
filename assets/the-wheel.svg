<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">THE WHEEL</title><desc id="d">Topology of the tet: the Master above the Dinh, three seats beneath, every seat connected to every other. Each pair carries two channels in two directions, giving twenty-four distinct cryptographic domains.</desc><rect width="1180" height="860" fill="#0B1015"/><text x="48" y="56" font-size="26" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="1.5">THE WHEEL</text><text x="48" y="84" font-size="15" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Every seat connects to the Dinh and to every other seat. A tree has one path; a wheel has spares.</text><line x1="590.0" y1="220.0" x2="806.5" y2="595.0" stroke="#33424F" stroke-width="1.6"/><circle cx="698.3" cy="407.5" r="15" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="698.2531754730549" y="411.5" font-size="11" fill="#A7B6C2" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><line x1="590.0" y1="220.0" x2="373.5" y2="595.0" stroke="#33424F" stroke-width="1.6"/><circle cx="481.7" cy="407.5" r="15" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="481.74682452694515" y="411.5" font-size="11" fill="#A7B6C2" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><line x1="590.0" y1="220.0" x2="590.0" y2="220.0" stroke="#33424F" stroke-width="1.6"/><circle cx="590.0" cy="220.0" r="15" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="590.0" y="224.0" font-size="11" fill="#A7B6C2" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><line x1="806.5" y1="595.0" x2="373.5" y2="595.0" stroke="#33424F" stroke-width="1.6"/><circle cx="590.0" cy="595.0" r="15" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="590.0" y="599.0" font-size="11" fill="#A7B6C2" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><line x1="806.5" y1="595.0" x2="590.0" y2="220.0" stroke="#33424F" stroke-width="1.6"/><circle cx="698.3" cy="407.5" r="15" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="698.2531754730549" y="411.5" font-size="11" fill="#A7B6C2" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><line x1="373.5" y1="595.0" x2="590.0" y2="220.0" stroke="#33424F" stroke-width="1.6"/><circle cx="481.7" cy="407.5" r="15" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="481.74682452694515" y="411.5" font-size="11" fill="#A7B6C2" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><rect x="440.0" y="54" width="300" height="66" rx="12" fill="#161E27" stroke="#F3F7F9" stroke-width="2"/><text x="590.0" y="86" font-size="19" fill="#F3F7F9" text-anchor="middle" font-weight="700" letter-spacing="1.4">THE MASTER</text><text x="590.0" y="106" font-size="11.5" fill="#A7B6C2" text-anchor="middle" font-weight="400" letter-spacing="0">the human. may intervene at any seat.</text><line x1="590.0" y1="120" x2="590.0" y2="162.0" stroke="#F3F7F9" stroke-width="2" stroke-dasharray="6 4"/><circle cx="590.0" cy="220.0" r="58" fill="#1E2833" stroke="#F5A524" stroke-width="3"/><circle cx="590.0" cy="220.0" r="44" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="590.0" y="222.0" font-size="12.5" fill="#F5A524" text-anchor="middle" font-weight="700" letter-spacing="0">DINH</text><text x="590.0" y="298.0" font-size="12" fill="#A7B6C2" text-anchor="middle" font-weight="400" letter-spacing="0">decides for the Master</text><circle cx="806.5" cy="595.0" r="58" fill="#1E2833" stroke="#2DD4E8" stroke-width="3"/><circle cx="806.5" cy="595.0" r="44" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="806.5063509461097" y="597.0" font-size="12.5" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">GUNSLINGER</text><text x="806.5063509461097" y="673.0" font-size="12" fill="#A7B6C2" text-anchor="middle" font-weight="400" letter-spacing="0">24 chambers · machines</text><circle cx="373.5" cy="595.0" r="58" fill="#1E2833" stroke="#E87BC8" stroke-width="3"/><circle cx="373.5" cy="595.0" r="44" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="373.4936490538903" y="589.0" font-size="11" fill="#E87BC8" text-anchor="middle" font-weight="700" letter-spacing="0">THE SECOND</text><text x="373.4936490538903" y="604.0" font-size="11" fill="#E87BC8" text-anchor="middle" font-weight="700" letter-spacing="0">GUNSLINGER</text><text x="373.4936490538903" y="673.0" font-size="12" fill="#A7B6C2" text-anchor="middle" font-weight="400" letter-spacing="0">24 chambers · seven to a human</text><circle cx="590.0" cy="220.0" r="58" fill="#1E2833" stroke="#4ADE80" stroke-width="3"/><circle cx="590.0" cy="220.0" r="44" fill="#0B1015" stroke="#33424F" stroke-width="1.2"/><text x="590.0" y="222.0" font-size="12.5" fill="#4ADE80" text-anchor="middle" font-weight="700" letter-spacing="0">ARCHIVIST</text><text x="590.0" y="298.0" font-size="12" fill="#A7B6C2" text-anchor="middle" font-weight="400" letter-spacing="0">the only hand that writes</text><rect x="48" y="776" width="1084" height="64" rx="14" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><text x="70" y="808" font-size="13" fill="#F3F7F9" text-anchor="start" font-weight="600" letter-spacing="0">4 seats with a repository   ·   6 pairs   ·   2 channels per pair   ·   2 directions   =   24 distinct keys, none interchangeable</text><text x="70" y="830" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Two seats hold no repository: the Master is the human, and the Dinh decides in his place.</text></svg>