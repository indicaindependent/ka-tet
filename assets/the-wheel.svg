<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="950" viewBox="0 0 1180 950" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">THE WHEEL</title>
<desc id="d">Topology of the tet as of 2026-10-15: the Master above the Dinh at the hub, and five seats on the rim: the Gunslinger, the Second Gunslinger, the Balladeer, Cort and the Archivist. Every seat may reach the Dinh and every other seat. Six agent seats make fifteen pairs; each pair has two channels in two directions, sixty key domains in all. A shared gate proves a message came from a member; each seat's own signature proves which one. Only the Archivist publishes.</desc>
<rect width="1180" height="950" fill="#0B1015"/>
<text x="48" y="56" font-size="26" fill="#F3F7F9" font-weight="700" letter-spacing="1.5">THE WHEEL</text>
<text x="48" y="84" font-size="15" fill="#A7B6C2">Every seat connects to the Dinh and to every other seat. A tree has one path; a wheel has spares.</text>
